# boostCX standard label definitions
# Source of truth for org-wide repository labels.
# These labels are synchronized to org repos by private internal automation.
#
# Labels must not duplicate canonical metadata tracked as org-level issue fields.
#
# Do NOT represent type, area, severity, priority, estimates, workstreams, etc. with labels.

# ── Meta / triage labels ─────────────────────────────────────
- name: needs-clarification
  color: "cccccc"
  description: "Missing details to meet Definition of Ready (DoR)"

# ── Release tracking ─────────────────────────────────────────
- name: release
  color: "5319e7"
  description: "Release candidate tracking"
