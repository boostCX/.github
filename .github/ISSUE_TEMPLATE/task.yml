name: "Task"
description: "Internal engineering or operational work (standalone or sub-task of a story)."
type: Task
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        **Use this for internal work:** tech debt, refactors, CI/CD, infrastructure, documentation, or implementation sub-tasks of a story.
        > **Triage:** Do not use labels for canonical metadata. Set org-level issue fields (Priority, Estimate (hours), Blocked, Workstream, etc.) and use Project 3 only for `Status`/`Iteration`. Product area is determined by the repository that owns the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What needs to be done and why."
      placeholder: "Clear description of the work."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: "How do we know this is done?"
      placeholder: |
        - [ ] Condition 1
        - [ ] Condition 2
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner / assignee
      placeholder: "@github-username"
    validations:
      required: false

  - type: input
    id: parent
    attributes:
      label: Parent issue (if sub-task)
      description: "Link the parent story or epic if this is a child task."
      placeholder: "#123 or URL"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes / context
      placeholder: "Additional context, links, or constraints."
    validations:
      required: false
